<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; }
  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #faf8f5;
    color: #1a1a2e;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 56px;
  }
  .brand {
    display: flex;
    flex-direction: column;
  }
  .glyph {
    display: block;
    width: 370px;
    height: 356px;
  }
  .wordmark {
    margin-top: 10px;
    font-family: 'Courier New', Courier, monospace;
    font-size: 44px;
    line-height: 1;
  }
  .wordmark-tensor { font-weight: 700; color: #1a1a2e; }
  .wordmark-binge { font-weight: 400; color: #8b949e; }
  .url {
    margin-top: 12px;
    font-family: 'Courier New', Courier, monospace;
    font-size: 20px;
    color: #b07828;
  }
  .thesis {
    width: 620px;
    margin: 0;
    font-size: 60px;
    font-weight: 300;
    line-height: 1.15;
    letter-spacing: -0.5px;
  }
  .accent {
    border-bottom: 3px solid #b07828;
    padding-bottom: 2px;
  }
</style>
</head>
<body>
  <div class="row">
    <div class="brand">
      <svg class="glyph" viewBox="70 45 310 300" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrow" markerWidth="5" markerHeight="4" refX="4" refY="2" orient="auto" markerUnits="strokeWidth">
            <polygon points="0,0 5,2 0,4" fill="#8b949e" opacity="0.50"/>
          </marker>
        </defs>
        <g transform="translate(220, 195) scale(12) translate(-15, -20)">
          <circle cx="9" cy="20" r="5" fill="#1a1a2e" fill-opacity="0.08" stroke="#1a1a2e" stroke-width="1.2"/>
          <text x="9" y="20" text-anchor="middle" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="6" font-weight="700" fill="#1a1a2e">T</text>
          <circle cx="22" cy="14" r="4" fill="#8b949e" fill-opacity="0.12" stroke="#8b949e" stroke-width="1"/>
          <text x="22" y="14" text-anchor="middle" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="5" font-weight="400" fill="#8b949e">α</text>
          <circle cx="22" cy="26" r="4" fill="#8b949e" fill-opacity="0.12" stroke="#8b949e" stroke-width="1"/>
          <text x="22" y="26" text-anchor="middle" dominant-baseline="central" font-family="'Courier New', Courier, monospace" font-size="5" font-weight="400" fill="#8b949e">β</text>
          <line x1="14" y1="19" x2="17.5" y2="14.2" stroke="#8b949e" stroke-width="0.5" opacity="0.50" marker-end="url(#arrow)"/>
          <line x1="14" y1="21" x2="17.5" y2="25.8" stroke="#8b949e" stroke-width="0.5" opacity="0.50" marker-end="url(#arrow)"/>
        </g>
      </svg>
      <div class="wordmark"><span class="wordmark-tensor">Tensor</span><span class="wordmark-binge">[binge]</span></div>
      <div class="url">tensorbinge.com</div>
    </div>
    <p class="thesis">We build <span class="accent">tools</span> at the intersection of machine learning, quantitative finance &amp; systems engineering.</p>
  </div>
</body>
</html>
