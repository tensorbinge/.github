<article class="post-row">
  <time class="post-date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time>
  <h2 class="post-row-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
  {{ range first 1 (findRE `(?s)<p>.*?</p>` .Content) }}{{ . | replaceRE `^<p>` `<p class="post-summary">` | safeHTML }}{{ end }}
  {{ partial "tag-links.html" . }}
</article>
